<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>My First Webpage</title>
  </head>
  <body>
    <header>
      <!--
        Creating the main navigation for the page.

        This format of nav > ul > li > a is the industry
        standard for creating main navigation!

        We will be using this forever going forward!
      -->
      <nav>
        <ul>
          <li><a href="index.html">Practice Home Page</a></li>
          <li>
            <a href="headings-and-paragraphs.html">
              Headings and Paragraphs Practice
            </a>
          </li>
          <li><a href="links-and-images.html">Links and Images Practice</a></li>
          <li>
            <a href="iframes-lists-tables.html"
              >IFrames, Lists, and Tables Practice</a
            >
          </li>
          <li><a href="forms.html">Forms Practice</a></li>
        </ul>
      </nav>
      <!-- 
        This is an h1 tag.
        It is the largest type of heading and is
        used as the main heading of your website.
      -->
      <h1>Hello World!</h1>
    </header>

    <main>
      <!-- 
        This is a paragraph tag.
        It is used to add sentences of text to
        your website.
      -->
      <p>My name is John Hammond.</p>

      <!-- 
        This is an anchor tag.
        This links us to other web pages.
      -->
      <a
        href="https://www.pembinatrails.ca/ptcollegiate/ptec-pembina-trails-early-college-a-program-offered-at-ptc">
        Link to the PTEC website
      </a>
    </main>
    <footer>
      <p><b>&#169;2026 Mr. Hardman</b></p>
    </footer>
  </body>
</html>

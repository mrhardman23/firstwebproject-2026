<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Links and Images Practice</title>
  </head>
  <body>
    <h1>Links and Images Practice</h1>
    <p>This web page shows the difference between block and inline elements!</p>
    <a href="index.html">Link to Home Page</a>
    <a href="headings-and-paragraphs.html">
      Link to Headings and Paragraphs Practice
    </a>
    <a
      href="https://bdnmb.ca/default-set-to-rock-brandon-with-houstons-performance-this-september/"
      target="_blank">
      Link to article about Default's Brandon concert
    </a>
    <img
      src="images/bird.jpg"
      width="200"
      alt="A bird sitting on a tree branch doing a bird call." />
    <a
      href="https://freenaturestock.com/bird-calling-from-a-tree/"
      target="_blank"
      >Link to the Bird image</a
    >
    <img
      src="images/daisy.jpg"
      width="40%"
      alt="A close-up of a daisy with water droplets on its petals." />
    <a
      href="https://freenaturestock.com/closeup-of-dew-on-flower/"
      target="_blank"
      >Link to the Daisy image</a
    >
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Headings and Paragraphs</title>
  </head>
  <body>
    <!-- 
      h1 is the largest type of heading 
      and will typically be the same shared
      heading across all of your web pages.
    -->
    <h1>Welcome to my Website!</h1>
    <!--
      h2 is the second largest heading.

      h2 can either be the heading of the specific page
      or it would be the sub-heading of the main heading.
      
      Example of it being a heading for a specific page
      would be if it was the iPads page of the Apple website.
      
      Example of it being a sub-heading for the main heading
      could be McDonald's "I'm Lovin' It".
    -->
    <h2>I'm So Glad You're Here!</h2>
    <!-- 
      h3 is the third largest heading.

      It might be the subheading of a new section of the web page
      or it might be a heading for a new section if the h2 was
      only used as a subheading to the main heading.

      In the example of Apple being the h1 and iPads being the h2,
      iPad Mini & iPad Pro could be h3s because they would be subheadings
      of the iPad section.

      In the example of McDonald's being the h1 and "I'm Lovin' It"
      being the h2, h3 would be used to write "Burgers".
    -->
    <h3>This is for a PTEC Class!</h3>
    <!-- 
      h4 is the third smallest heading and will most likely
      not be used by anybody in this class.
    -->
    <h4>Mr. Hardman is kind of weird...</h4>
    <!-- 
      h5 is the second smallest heading and will most likely
      not be used by anybody in this class.
    -->
    <h5>But I guess he's an alright teacher.</h5>
    <!-- 
      h6 is the smallest heading and will most likely
      not be used by anybody in this class.
    -->
    <h6>He seems knowledgable enough!</h6>
    <p>PTEC is a pretty cool program!</p>
  </body>
</html>
